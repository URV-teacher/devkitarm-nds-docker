# This is a development compose.yml. Use the one in examples/compose.yml to bootstrap a template for your project
services:
  devkitarm-nds:
    pull_policy: always
    image: aleixmt/devkitarm-nds:latest
    container_name: devkitarm-nds
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./:/input
    entrypoint: sh -c "cd /input && make clean && make"
    user: 1000:1000


